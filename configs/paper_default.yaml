detector:
  name: YOLO11n
  frozen: true
  input_size: 640
  confidence_threshold: 0.25

classes:
  entities: [Worker, Helmet, Safety_vest, Safety_belt, Hazardous_area, Tool, Large_machinery]
  predicates: [wear, into, near, performing, none]

model:
  backbone: mpgnn
  object_appearance_dim: 16
  union_appearance_dim: 16
  pair_geometry_dim: 18
  pair_feature_dim: 66
  spatial_evidence_dim: 8
  hidden_dim: 128
  num_layers: 3
  dropout: 0.3
  num_heads: 4
  ffn_dim: 512

rules:
  object_predicate:
    - {subject: Worker, object: Helmet, allow: [wear, none]}
    - {subject: Worker, object: Safety_vest, allow: [wear, none]}
    - {subject: Worker, object: Safety_belt, allow: [wear, none]}
    - {subject: Worker, object: Hazardous_area, allow: [into, near, none]}
    - {subject: Worker, object: Tool, allow: [performing, near, none]}
    - {subject: Worker, object: Large_machinery, allow: [performing, near, none]}

thresholds:
  zone_overlap: 0.02
  contact: 0.02
  zone_iou: 0.01
  near_boundary_distance: 0.20
  zone_occupancy: 0.6667
  machinery_inclusion: 0.98

loss:
  class_weights: [1.0, 2.5, 2.0, 2.0, 0.25]
  weights:
    relation: 1.0
    ppe: 0.2
    zone: 0.1
    interaction: 0.1
    legality: 0.1

training:
  seed: 41
  seeds: [41, 42, 43]
  batch_size: 4
  epochs: 30
  optimizer: Adam
  learning_rate: 0.0005
  weight_decay: 0.0001
  scheduler: cosine
  minimum_lr_ratio: 0.2
  gradient_clip: 1.0
  checkpoint_metric: mR@5

evaluation:
  topk: [1, 3, 5, 10]
  primary_inference_uses_posthoc: false
